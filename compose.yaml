services:
  mapago:
    build:
      context: .
    init: true
    environment:
      MAPAGO_PUBLIC_AUTHORITY: "127.0.0.1:${MAPAGO_PORT:-8765}"
    ports:
      - "127.0.0.1:${MAPAGO_PORT:-8765}:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; req=urllib.request.Request('http://127.0.0.1:8765/', headers={'Host': os.environ['MAPAGO_PUBLIC_AUTHORITY']}); urllib.request.urlopen(req, timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
